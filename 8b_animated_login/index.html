<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Animated Login Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Center Card -->
  <div class="login-card" id="login-box">
    <div class="login-header">
      <h2 style="font-size: 1.6rem; margin-top: 0; margin-bottom: 0.3rem;">Login</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">Sign in to authenticate credentials</p>
    </div>

    <form id="animated-login-form">
      <div class="form-group">
        <label for="email-input">Email Address</label>
        <input type="email" id="email-input" class="form-control" placeholder="admin@novatech.com" required>
        <div class="error-text" id="email-err">Enter a valid email.</div>
      </div>

      <div class="form-group">
        <label for="pass-input">Password</label>
        <input type="password" id="pass-input" class="form-control" placeholder="••••••••" required>
        <div class="error-text" id="pass-err">Password must be at least 6 characters.</div>
      </div>

      <button type="submit" class="btn-login">Submit Credentials</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
