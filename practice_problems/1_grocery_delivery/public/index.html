<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshCart - Grocery Delivery</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load React, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      const [products, setProducts] = useState([]);
      const [selectedCat, setSelectedCat] = useState('All');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [showCheckout, setShowCheckout] = useState(false);
      const [activeOrder, setActiveOrder] = useState(null); // { id, address, step }
      
      // Checkout Form
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');

      // Fetch products from server on mount
      useEffect(() => {
        fetch('/api/products')
          .then(res => res.json())
          .then(data => setProducts(data))
          .catch(err => console.error("Error loading products", err));
      }, []);

      const filteredProducts = useMemo(() => {
        if (selectedCat === 'All') return products;
        return products.filter(p => p.category === selectedCat);
      }, [products, selectedCat]);

      // Add to cart
      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(item => item.id === product.id);
          if (exists) {
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
      };

      const updateQty = (id, change) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const nextQty = item.quantity + change;
            return nextQty > 0 ? { ...item, quantity: nextQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      // Handle checkout order placement
      const handleCheckout = (e) => {
        e.preventDefault();
        if (!name || !phone || !address) return;

        const orderData = {
          name,
          phone,
          address,
          items: cart,
          total: cartTotal
        };

        fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        })
          .then(res => res.json())
          .then(data => {
            setActiveOrder({
              id: data.orderId,
              address: address,
              step: 0
            });
            setCart([]);
            setShowCheckout(false);
            setIsCartOpen(false);
            setName('');
            setPhone('');
            setAddress('');
          })
          .catch(err => alert("Error booking order"));
      };

      // Poll order tracking details
      useEffect(() => {
        if (!activeOrder) return;
        if (activeOrder.step >= 3) return;

        const interval = setInterval(() => {
          fetch(`/api/orders/${activeOrder.id}/track`)
            .then(res => res.json())
            .then(data => {
              setActiveOrder(prev => prev ? { ...prev, step: data.step } : null);
              if (data.step >= 3) {
                clearInterval(interval);
              }
            });
        }, 5000); // Check status every 5s

        return () => clearInterval(interval);
      }, [activeOrder]);

      const categories = ['All', 'Produce', 'Dairy', 'Bakery', 'Pantry'];

      return (
        <div>
          <header>
            <a href="#" className="logo">
              <span>Fresh</span>Cart 🍎
            </a>
            <button 
              style={{ background: 'rgba(255,255,255,0.05)', color: 'white', border: '1px solid var(--border)', padding: '0.6rem 1.2rem', borderRadius: '50px', cursor: 'pointer' }}
              onClick={() => setIsCartOpen(true)}
            >
              🛒 Cart ({cart.reduce((sum, i) => sum + i.quantity, 0)})
            </button>
          </header>

          <main className="container">
            {/* Active order tracking */}
            {activeOrder && (
              <div className="tracker-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <h3 style={{ margin: 0 }}>Active Delivery Tracking</h3>
                    <p style={{ margin: '0.2rem 0 0 0', fontSize: '0.85rem' }}>Order ID: {activeOrder.id}</p>
                  </div>
                  <span style={{ color: 'var(--primary)', fontWeight: 'bold' }}>
                    {['Order Placed', 'Order Dispatched', 'Out for Delivery', 'Delivered'][activeOrder.step]}
                  </span>
                </div>

                <div className="steps">
                  <div className={`step-node ${activeOrder.step >= 0 ? 'active' : ''}`}>
                    <div className="step-circle">1</div>
                    <div className="step-label">Placed</div>
                  </div>
                  <div className={`step-node ${activeOrder.step >= 1 ? 'active' : ''}`}>
                    <div className="step-circle">2</div>
                    <div className="step-label">Dispatched</div>
                  </div>
                  <div className={`step-node ${activeOrder.step >= 2 ? 'active' : ''}`}>
                    <div className="step-circle">3</div>
                    <div className="step-label">Out for Delivery</div>
                  </div>
                  <div className={`step-node ${activeOrder.step >= 3 ? 'active' : ''}`}>
                    <div className="step-circle">4</div>
                    <div className="step-label">Arrived</div>
                  </div>
                </div>
                {activeOrder.step === 3 && (
                  <button 
                    className="btn" 
                    style={{ marginTop: '1.2rem', padding: '0.4rem', width: 'auto' }}
                    onClick={() => setActiveOrder(null)}
                  >
                    Dismiss Tracking
                  </button>
                )}
              </div>
            )}

            {/* Filter Category pills */}
            <div className="categories">
              {categories.map(cat => (
                <button 
                  key={cat}
                  className={`category-btn ${selectedCat === cat ? 'active' : ''}`}
                  onClick={() => setSelectedCat(cat)}
                >
                  {cat}
                </button>
              ))}
            </div>

            {/* Product catalog grid */}
            <div className="products-grid">
              {filteredProducts.map(p => (
                <div className="product-card" key={p.id}>
                  <div className="product-img">{p.emoji}</div>
                  <div className="product-info">
                    <h3 className="product-name">{p.name}</h3>
                    <span className="product-qty">{p.qty}</span>
                    <div className="product-footer">
                      <span className="product-price">${p.price.toFixed(2)}</span>
                      <button className="btn-add" onClick={() => addToCart(p)}>+</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Cart Sidebar */}
          <div className={`cart-sidebar ${isCartOpen ? 'open' : ''}`}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
              <h2 style={{ margin: 0 }}>Shopping Cart</h2>
              <button 
                style={{ background: 'none', border: 'none', color: '#9ca3af', fontSize: '1.5rem', cursor: 'pointer' }}
                onClick={() => setIsCartOpen(false)}
              >
                ✕
              </button>
            </div>

            <div style={{ flexGrow: 1, overflowY: 'auto' }}>
              {cart.length === 0 ? (
                <p style={{ color: 'var(--text-muted)', textAlign: 'center', marginTop: '4rem' }}>Your cart is empty.</p>
              ) : (
                cart.map(item => (
                  <div className="cart-item" key={item.id}>
                    <div>
                      <h4 style={{ margin: 0 }}>{item.name}</h4>
                      <span style={{ color: 'var(--primary)', fontSize: '0.85rem' }}>${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                    <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                      <button style={{ background: 'none', border: '1px solid var(--border)', color: 'white', padding: '0.2rem 0.5rem', borderRadius: '4px', cursor: 'pointer' }} onClick={() => updateQty(item.id, -1)}>-</button>
                      <span>{item.quantity}</span>
                      <button style={{ background: 'none', border: '1px solid var(--border)', color: 'white', padding: '0.2rem 0.5rem', borderRadius: '4px', cursor: 'pointer' }} onClick={() => updateQty(item.id, 1)}>+</button>
                    </div>
                  </div>
                ))
              )}
            </div>

            {cart.length > 0 && (
              <div style={{ marginTop: 'auto', borderTop: '1px solid var(--border)', paddingTop: '1.5rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 'bold', fontSize: '1.15rem', marginBottom: '1.5rem' }}>
                  <span>Total</span>
                  <span>${cartTotal.toFixed(2)}</span>
                </div>
                <button className="btn" onClick={() => setShowCheckout(true)}>Proceed to Checkout</button>
              </div>
            )}
          </div>

          {/* Checkout Modal */}
          {showCheckout && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
                  <h3 style={{ margin: 0 }}>Delivery Details</h3>
                  <button style={{ background: 'none', border: 'none', color: 'white', cursor: 'pointer' }} onClick={() => setShowCheckout(false)}>✕</button>
                </div>
                <form onSubmit={handleCheckout}>
                  <div className="form-group">
                    <label>Full Name</label>
                    <input type="text" className="form-control" value={name} onChange={e=>setName(e.target.value)} required />
                  </div>
                  <div className="form-group">
                    <label>Phone Number</label>
                    <input type="tel" className="form-control" value={phone} onChange={e=>setPhone(e.target.value)} required />
                  </div>
                  <div className="form-group">
                    <label>Delivery Address</label>
                    <textarea className="form-control" rows="3" value={address} onChange={e=>setAddress(e.target.value)} required></textarea>
                  </div>
                  <button type="submit" className="btn" style={{ marginTop: '1rem' }}>Place Order</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
