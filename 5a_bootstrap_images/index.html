<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Side-by-Side Images</title>
  <!-- Load Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gallery-section">
    <div class="text-center mb-5">
      <h1 class="fw-bold">Side-by-Side Bootstrap Gallery</h1>
      <p class="text-muted">A responsive three-column grid demonstrating card layouts with hover scale-zoom transitions.</p>
    </div>

    <!-- Bootstrap Row -->
    <div class="row g-4">
      
      <!-- Image Card 1 -->
      <div class="col-md-4">
        <div class="img-wrapper">
          <div class="img-card" style="background: linear-gradient(135deg, #f59e0b, #e11d48);">
            <div class="overlay">
              <h4>Alpine Sunset</h4>
              <p>Majestic high peak vistas during sunset.</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Image Card 2 -->
      <div class="col-md-4">
        <div class="img-wrapper">
          <div class="img-card" style="background: linear-gradient(135deg, #10b981, #065f46);">
            <div class="overlay">
              <h4>Emerald Woods</h4>
              <p>Tranquil forest trails under pine canopies.</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Image Card 3 -->
      <div class="col-md-4">
        <div class="img-wrapper">
          <div class="img-card" style="background: linear-gradient(135deg, #06b6d4, #3b82f6);">
            <div class="overlay">
              <h4>Ocean Tides</h4>
              <p>Stunning coastal reef currents and waves.</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
